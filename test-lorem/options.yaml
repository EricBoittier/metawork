device: cpu
base_precision: 32
seed: 3375767630
final_eval: true
print_stats: auto
test_set: 0.1
architecture:
  name: experimental.lorem
  model:
    cutoff: 5.0
    max_degree: 1
    max_degree_lr: 1
    num_features: 64
    num_spherical_features: 32
    num_radial: 32
    num_species: 8
    num_message_passing: 0
    equivariant_message_passing: true
    initialize_node_features: true
  training:
    distributed_port: 39591
    batch_size: 64
    max_atoms_per_batch: null
    min_atoms_per_batch: 0
    num_epochs: 200
    warmup_fraction: 0.001
    learning_rate: 0.0005
    weight_decay: null
    log_interval: 10
    checkpoint_interval: 10
    scale_targets: true
    atomic_baseline: {}
    fixed_scaling_weights: {}
    per_structure_targets: []
    num_workers: null
    log_mae: false
    log_separate_blocks: false
    best_model_metric: rmse_prod
    grad_clip_norm: 1.0
    loss:
      energy:
        type: mse
        weight: 1.0
        reduction: mean
        gradients:
          positions:
            type: mse
            weight: 1.0
            reduction: mean
          strain:
            type: mse
            weight: 1.0
            reduction: mean
training_set:
  - systems:
      read_from: mad_subset.xyz
      reader: null
      length_unit: angstrom
    targets:
      energy:
        quantity: energy
        read_from: mad_subset.xyz
        reader: null
        key: ecumetric_energy
        unit: eV
        sample_kind: system
        type: scalar
        num_subtargets: 1
        description: ""
        forces:
          read_from: mad_subset.xyz
          reader: null
          key: forces
        stress:
          read_from: mad_subset.xyz
          reader: null
          key: stress
        virial: false
validation_set: 0.1

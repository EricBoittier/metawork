# Paths are resolved relative to this file's directory unless absolute.
metatrain: /home/boittier/metawork/metatrain
python: /home/boittier/metawork/.venv/bin/python
worktrees: worktrees
results: results
data: data

# First ref is the worktree HEAD; any further refs are merged into it.
variants:
  baseline:
    refs: [origin/perf/1-pipeline-benchmark]
  persistent:
    refs: [origin/perf/4-persistent-workers]
  timed:
    refs: [origin/pr/collate-transform-timing]
  pinned:
    refs:
      - origin/pr/collate-transform-timing
      - origin/pr/pin-batches
  transport:
    refs: [origin/pr/system-tensor-transport]
  everything:
    refs: [origin/perf/5-batch-transport]

datasets:
  qm9:
    path: /home/boittier/metawork/metatrain/tests/resources/qm9_reduced_100.xyz
    key: U0
  carbon:
    path: /home/boittier/metawork/metatrain/tests/resources/carbon_reduced_100.xyz
    key: energy
  si216:
    path: data/si_bulk_216.xyz
    key: energy
    generate:
      n_cells: 3
      n_structures: 64
      seed: 0
  omol_proxy:
    path: data/omol_proxy.xyz
    key: energy
    generate:
      n_structures: 200
      max_cells: 4
      seed: 0
  # Same size-diverse proxy as omol_proxy, scaled up: 2x the structures and
  # max_cells 4->6 (max unit-cell repeat 4^3=64 -> 6^3=216, so max structure
  # size roughly 4x, up to ~1700 atoms for Si/NaCl). Heavier per-item
  # neighbor-list/collate cost is what would let num_workers>=1 overlap
  # loading with compute enough to matter -- omol_proxy's small structures
  # (max ~512 atoms) keep collate cheap enough that workers>=1 barely helps.
  omol_large:
    path: data/omol_large.xyz
    key: energy
    generate:
      n_structures: 400
      max_cells: 6
      seed: 1
  # For the `distributed:` sweep only (matrix: false keeps it out of the
  # variant x dataset x workers cross product below -- see MATRIX_DATASETS
  # in the Snakefile). Bigger and more size-diverse than omol_large: 3000
  # structures, max_cells 8 (up to ~4096 atoms for Si/NaCl), meant to stand
  # in for a slice of a billion-structure-scale, OMol-like training set for
  # DDP scaling measurements, not to be trained on to convergence.
  omol_billion_proxy:
    path: data/omol_billion_proxy.xyz
    key: energy
    matrix: false
    generate:
      n_structures: 3000
      max_cells: 8
      seed: 2
  # Scaled-up version for the `distributed_best` sweep: same max structure
  # size (max_cells=8, same memory profile already validated) but ~7x the
  # structures, for a larger, more statistically robust throughput
  # measurement closer to a real training regime's step count.
  omol_billion_proxy_v2:
    path: data/omol_billion_proxy_v2.xyz
    key: energy
    matrix: false
    generate:
      n_structures: 20000
      max_cells: 8
      seed: 4

sweep:
  workers: [0, 1, 4]
  batch_size: [8]
  device: cuda
  epochs: 6
  repeats: 2
  timeout_s: 3600

# Used when --config smoke=true or --config run=smoke
# (`smoke=true` overwrites this mapping in snakemake's config; the
# Snakefile re-reads the block from this file.)
smoke:
  variants: [everything]
  datasets: [qm9]
  workers: [0]
  batch_size: [8]
  device: cpu
  epochs: 2
  repeats: 1
  timeout_s: 1200

resources:
  cpus: 8
  mem_mb: 16000
  runtime_min: 90
  gpus: 1

baseline_variant: baseline

# Real multi-GPU DDP + atoms-per-batch sweep, separate from the main matrix
# since it needs a different Slurm allocation (world_size GPUs, via `srun
# --ntasks`, not the single-GPU-per-cell model above). Build with
# `snakemake distributed --resources gpu=<max world_size>`, from a job that
# actually requested that many GPUs+tasks (see smoke-slurm/multigpu-smoke.sbatch).
#
# Sized for the NVIDIA compute-grant proposal ("Scaling interatomic
# potential with universal billion-structure dataset", target resource
# 8xH100): world_sizes up to 8. kuma's H100 nodes are 4 GPUs each
# (CfgTRES gres/gpu=4, checked via `scontrol show node`), so world_size=8
# here means 2 nodes over InfiniBand (ConnectX-7), not one 8-GPU box --
# the 1/2/4 points are single-node (NVLink/PCIe-domain), 8 is cross-node.
# Report that distinction alongside the numbers; it is a real difference
# from a single DGX-H100-class node.
distributed:
  variants: [baseline, everything]
  dataset: omol_billion_proxy
  world_sizes: [1, 2, 4, 8]
  # 8 hit 71.75GB reserved (of an H100's 80GB) on a batch that happened to
  # draw several of the largest (~4096-atom) structures at once -- baseline
  # can't use max_atoms_per_batch to bound that, so batch_size=4 instead,
  # for headroom across the full sweep.
  batch_size: 4
  # baseline predates --max-atoms-per-batch entirely (see the Snakefile's
  # distributed_cell rule) -- null keeps this a fair fixed-batch_size DDP
  # scaling comparison across both variants, not a batching-strategy mix.
  max_atoms_per_batch: null
  epochs: 2
  repeats: 2
  timeout_s: 2400
  cpus_per_task: 8
  mem_mb: 65536
  runtime_min: 45

# "Best expected vs baseline": each variant run with the best batching
# strategy it actually supports, not held to a shared fixed batch_size --
# baseline (no max_atoms_per_batch support) still uses fixed batch_size,
# everything uses the atom-count sampler (8192 was the best speed/memory
# tradeoff measured in the small-scale A/B: +22% throughput, -18% peak
# memory vs its own fixed-batch_size run). This is what you'd actually
# deploy, not a controlled ablation -- see distributed: above for that.
distributed_best:
  variants: [baseline, everything]
  dataset: omol_billion_proxy_v2
  # world_size=8 (cross-node) dropped here: the fair fixed-batch sweep
  # (distributed: above) already validated the 1/2/4/8 scaling *pattern*.
  world_sizes: [1, 2, 4]
  batch_size: 4
  variant_overrides:
    everything:
      max_atoms_per_batch: 8192
  epochs: 2
  # repeats=1: the fair fixed-batch sweep (distributed:) already confirmed
  # <1% run-to-run variance at the smaller 3000-structure scale, and a
  # 2-node/4h allocation was queuing ~5h out on a now-busy cluster --
  # single-repeat keeps this directional-but-solid without the wait.
  repeats: 1
  # 20000 structures is ~6.7x omol_billion_proxy's 3000 -- world_size=1 (the
  # slowest case, before DDP splits the data) took ~130-150s/2-epoch at that
  # smaller scale, so budget generously here.
  timeout_s: 3300
  cpus_per_task: 8
  mem_mb: 65536
  runtime_min: 60

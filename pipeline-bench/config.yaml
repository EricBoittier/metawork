# Paths are resolved relative to this file's directory unless absolute.
metatrain: /home/boittier/metawork/metatrain
python: /home/boittier/metawork/.venv/bin/python
worktrees: worktrees
results: results
data: data

# First ref is the worktree HEAD; any further refs are merged into it.
variants:
  baseline:
    refs: [origin/perf/1-pipeline-benchmark]
  persistent:
    refs: [origin/perf/4-persistent-workers]
  timed:
    refs: [origin/pr/collate-transform-timing]
  pinned:
    refs:
      - origin/pr/collate-transform-timing
      - origin/pr/pin-batches
  transport:
    refs: [origin/pr/system-tensor-transport]
  everything:
    refs: [origin/perf/5-batch-transport]

datasets:
  qm9:
    path: /home/boittier/metawork/metatrain/tests/resources/qm9_reduced_100.xyz
    key: U0
  carbon:
    path: /home/boittier/metawork/metatrain/tests/resources/carbon_reduced_100.xyz
    key: energy
  si216:
    path: data/si_bulk_216.xyz
    key: energy
    generate:
      n_cells: 3
      n_structures: 64
      seed: 0
  si_large:
    path: data/si_bulk_1000_128.xyz
    key: energy

# Methodology notes (see results/equivalence.md, results/drift.md, and the
# caveats block at the top of results/summary.md for what these do and don't
# cover):
# - batch_size sweeps 3 points instead of pinning one: pin_memory's payoff
#   scales with transfer size, so a single batch size can't tell a variant
#   that loses at small batches from one that would win at larger ones.
# - repeats went 2 -> 5: with n=2 there's no way to tell a real difference
#   from run-to-run noise, only a range with no shape to it.
# - epochs went 6 -> 12: mechanisms that amortize a one-time cost across
#   epochs (persistent_workers not respawning workers) get a longer horizon
#   to pay off; 6 was likely too short to detect that mechanism either way.
# None of this excludes warm-up (the first epoch's CUDA/allocator setup is
# still timed like any other) — that needs re-instrumenting
# benchmark_pipeline.py per branch to report per-epoch splits, not just a
# config change here.
sweep:
  workers: [0, 1, 4]
  batch_size: [4, 8, 16]
  device: cuda
  epochs: 12
  repeats: 5
  timeout_s: 3600

# Used when --config smoke=true or --config run=smoke
# (`smoke=true` overwrites this mapping in snakemake's config; the
# Snakefile re-reads the block from this file.)
smoke:
  variants: [everything]
  datasets: [qm9]
  workers: [0]
  batch_size: [8]
  device: cpu
  epochs: 2
  repeats: 1
  timeout_s: 1200

resources:
  cpus: 8
  mem_mb: 16000
  runtime_min: 90
  gpus: 1

baseline_variant: baseline

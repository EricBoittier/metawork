# Paths are resolved relative to this file's directory unless absolute.
metatrain: /home/boittier/metawork/metatrain
python: /home/boittier/metawork/.venv/bin/python
worktrees: worktrees
results: results
data: data

# First ref is the worktree HEAD; any further refs are merged into it.
variants:
  baseline:
    refs: [origin/perf/1-pipeline-benchmark]
  persistent:
    refs: [origin/perf/4-persistent-workers]
  timed:
    refs: [origin/pr/collate-transform-timing]
  pinned:
    refs:
      - origin/pr/collate-transform-timing
      - origin/pr/pin-batches
  transport:
    refs: [origin/pr/system-tensor-transport]
  everything:
    refs: [origin/perf/5-batch-transport]

datasets:
  qm9:
    path: /home/boittier/metawork/metatrain/tests/resources/qm9_reduced_100.xyz
    key: U0
  carbon:
    path: /home/boittier/metawork/metatrain/tests/resources/carbon_reduced_100.xyz
    key: energy
  si216:
    path: data/si_bulk_216.xyz
    key: energy
    generate:
      n_cells: 3
      n_structures: 64
      seed: 0
  si_large:
    path: data/si_bulk_1000_128.xyz
    key: energy

# Methodology notes (see results/equivalence.md, results/drift.md, and the
# caveats block at the top of results/summary.md for what these do and don't
# cover):
# - batch_size sweeps 3 points instead of pinning one: pin_memory's payoff
#   scales with transfer size, so a single batch size can't tell a variant
#   that loses at small batches from one that would win at larger ones.
# - repeats went 2 -> 5: with n=2 there's no way to tell a real difference
#   from run-to-run noise, only a range with no shape to it.
# - epochs went 6 -> 12: mechanisms that amortize a one-time cost across
#   epochs (persistent_workers not respawning workers) get a longer horizon
#   to pay off; 6 was likely too short to detect that mechanism either way.
# None of this excludes warm-up (the first epoch's CUDA/allocator setup is
# still timed like any other) — that needs re-instrumenting
# benchmark_pipeline.py per branch to report per-epoch splits, not just a
# config change here.
sweep:
  workers: [0, 1, 4]
  batch_size: [4, 8, 16]
  device: cuda
  epochs: 12
  repeats: 5
  # One seed for the throughput sweep — cross-variant agreement on speed
  # isn't seed-sensitive the way training behavior is, and multiplying the
  # already-large sweep by several seeds buys little. Multi-seed testing
  # lives in the `correctness:` block below, scoped down to stay fast.
  seeds: [0]
  timeout_s: 3600

# Used when --config smoke=true or --config run=smoke
# (`smoke=true` overwrites this mapping in snakemake's config; the
# Snakefile re-reads the block from this file.)
smoke:
  variants: [everything]
  datasets: [qm9]
  workers: [0]
  batch_size: [8]
  device: cpu
  epochs: 2
  repeats: 1
  timeout_s: 1200

# Used when --config correctness=true or --config run=correctness. Small and
# multi-seed on purpose: this isn't measuring throughput (workers/batch_size
# are pinned to one point each to keep it fast), it's checking whether every
# variant trains to the same place across a few different fixed seeds, so an
# agreement (or a disagreement, like baseline vs. the rest) isn't a
# coincidence of one particular seed. See results/correctness.md and
# scripts/check_correctness.py.
correctness:
  variants: [baseline, persistent, timed, pinned, transport, everything]
  datasets: [qm9, carbon, si216, si_large]
  workers: [0]
  batch_size: [8]
  epochs: 6
  repeats: 1
  seeds: [0, 1, 2]
  timeout_s: 1200

# Always runs as part of `rule all` (not a --config mode like smoke/
# correctness above) — small and cheap enough (12 cells by default: 6
# variants x 2 worker counts) not to need opting into. Each cell trains
# once straight through and once through a real checkpoint save + restart
# (scripts/run_resume_check.py -> benchmarks/benchmark_checkpoint_resume.py),
# via the same code path `mtt train --restart` uses. See results/resume.md
# and scripts/check_resume.py. Requires every variant's worktree to have
# benchmarks/benchmark_checkpoint_resume.py — not yet true for the upstream
# refs in `variants:` above until the fix/report-best-metric* /
# fix/pipeline-benchmark-val-split branches land; until then a variant
# without the script reports status=no_resume_script rather than failing.
resume_check:
  datasets: [qm9]
  workers: [0, 1]
  batch_size: 8
  device: cuda
  epochs: 6
  split_epoch: 3
  seed: 0
  timeout_s: 1200

# Always runs as part of `rule all`, same as resume_check above. Fine-tunes
# a real pretrained PET-MAD checkpoint (lab-cosmo/upet on HuggingFace,
# downloaded once and cached under data/pet_mad_checkpoints/) instead of
# training a small model from scratch — a much bigger model (102 atomic
# types, energy + non-conservative force + stress heads), so this checks
# whether the same data-loading changes help/hurt at that different point
# in model size. See results/pet_mad.md and scripts/check_pet_mad.py.
# Requires benchmarks/benchmark_pet_mad.py on the variant's worktree — same
# fix branches as resume_check; a variant without it reports
# status=no_pet_mad_script rather than failing.
pet_mad:
  size: xs
  version: 1.6.0
  datasets: [qm9]
  workers: [0, 1]
  batch_size: 8
  device: cuda
  epochs: 4
  seed: 0
  timeout_s: 1200

# Always runs as part of `rule all`. FlashMD (experimental.flashmd) is a
# different architecture from PET, built on the same shared data-loading
# code this harness benchmarks, but the perf/data-loading branches don't
# touch its trainer at all — so this is a baseline/regression snapshot for
# FlashMD's own performance, not a "does the optimization help" comparison.
# Uses metatrain's own tiny FlashMD test fixture (10 32-atom frames,
# src/metatrain/experimental/flashmd/tests/data/flashmd.xyz) since there's
# no larger FlashMD-labeled dataset in this repo; epochs is the knob for
# getting a meaningful number of steps out of it. See results/flashmd.md
# and scripts/check_flashmd.py. Requires benchmarks/benchmark_flashmd.py on
# the variant's worktree — same fix branches as resume_check/pet_mad; a
# variant without it reports status=no_flashmd_script rather than failing.
flashmd:
  workers: [0, 1]
  batch_size: 4
  device: cuda
  epochs: 20
  seed: 0
  timeout_s: 1200

resources:
  cpus: 8
  mem_mb: 16000
  runtime_min: 90
  gpus: 1

baseline_variant: baseline

[project]
name = "metatomic-marimo"
version = "0.1.0"
description = "Local executable tutorials for the emerging metatomic Python API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "marimo>=0.19,<1",
  "numpy>=2,<3",
  "jax>=0.6,<1",
  "torch>=2.6,<3",
  "matplotlib>=3.9,<4",
  "metatomic-core",
  "pytest>=8,<10",
  "chemiscope>=1.1,<2",
  "ase>=3.26,<4",
  "starlette>=0.48,<2",
  "uvicorn>=0.30,<1",
]

[tool.uv.sources]
metatomic-core = { path = "../metatomic/python/metatomic_core" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metatomic_marimo"]

# Same toy XYZ as lorem-jax/examples/train-mlp (2 epochs).
# Run from the metawork root:
#   mtt train etc/lorem-parity/options-jax-toy.yaml
# Same structures, not a JAX energy match.

seed: 42

architecture:
  name: experimental.lorem
  model:
    cutoff: 5.0
    cutoff_width: 0.5
    max_degree: 1
    max_degree_lr: 0
    num_features: 16
    num_spherical_features: 2
    num_radial: 4
    num_message_passing: 0
    long_range:
      enable: true
      use_ewald: true
      lr_scale_init: 1.0
  training:
    num_epochs: 2
    batch_size: 4
    loss:
      energy:
        weight: 0.5
        gradients:
          positions:
            weight: 0.5

training_set:
  systems:
    read_from: lorem-jax/examples/train-mlp/data.xyz
    length_unit: angstrom
  targets:
    energy:
      key: energy
      unit: eV
      forces:
        key: forces

test_set: 0.1
validation_set: 0.1

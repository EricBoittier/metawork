# Same endpoints as options-multi.yaml, but everything lives in a
# DiskDataset zip (including the spherical polarizability).
#
#   python etc/qm7x_zenodo/zenodo_to_metatensor.py --n-samples 200 --format zip
#   mtt train etc/qm7x_zenodo/options-multi-zip.yaml
seed: 42

architecture:
  name: pet
  training:
    num_epochs: 5
    batch_size: 8
    loss:
      energy:
        weight: 1.0
        gradients:
          positions:
            weight: 1.0
      mtt::hlgap:
        weight: 1.0
      mtt::dipole:
        weight: 1.0
      mtt::hirshfeld_charge:
        weight: 1.0
      mtt::hirshfeld_dipole:
        weight: 1.0
      mtt::polarizability:
        weight: 1.0

training_set:
  systems:
    read_from: qm7x.zip
    length_unit: angstrom
  targets:
    energy:
      key: energy
      unit: eV
    mtt::hlgap:
      key: hlgap
      quantity: energy
      unit: eV
      sample_kind: system
      type: scalar
    mtt::dipole:
      key: dipole
      quantity: dipole
      unit: e*A
      sample_kind: system
      type:
        cartesian:
          rank: 1
    mtt::hirshfeld_charge:
      key: hirshfeld_charge
      quantity: charge
      unit: e
      sample_kind: atom
      type: scalar
    mtt::hirshfeld_dipole:
      key: hirshfeld_dipole
      sample_kind: atom
      type:
        cartesian:
          rank: 1
    mtt::polarizability:
      key: polarizability
      sample_kind: system
      unit: a0^3
      type:
        spherical:
          irreps:
            - {o3_lambda: 0, o3_sigma: 1}
            - {o3_lambda: 2, o3_sigma: 1}

test_set: 0.1
validation_set: 0.1

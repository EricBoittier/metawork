# endpoint: polarizability-spherical  |  model: space
# mtt train etc/qm7x_zenodo/options/polarizability-spherical-space.yaml
# Data: qm7x.xyz (+ polarizability_spherical.mts when needed).
# Convert first: python etc/qm7x_zenodo/zenodo_to_metatensor.py --n-samples 200
# mTPOL as spherical λ=0 + λ=2 (needs polarizability_spherical.mts)

seed: 42

architecture:
  name: experimental.space
  training:
    num_epochs: 5
    batch_size: 8
    loss:
      mtt::polarizability:
        weight: 1.0

training_set:
  systems:
    read_from: qm7x.xyz
    length_unit: angstrom
  targets:
    mtt::polarizability:
      read_from: polarizability_spherical.mts
      quantity: ""
      sample_kind: system
      unit: a0^3
      type:
        spherical:
          irreps:
            - {o3_lambda: 0, o3_sigma: 1}
            - {o3_lambda: 2, o3_sigma: 1}

test_set: 0.1
validation_set: 0.1

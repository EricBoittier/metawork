# endpoint: hirshfeld-charge  |  model: soap_bpnn
# mtt train etc/qm7x_zenodo/options/hirshfeld-charge-soap_bpnn.yaml
# Data: qm7x.xyz (+ polarizability_spherical.mts when needed).
# Convert first: python etc/qm7x_zenodo/zenodo_to_metatensor.py --n-samples 200
# Hirshfeld charges, per-atom scalar

seed: 42

architecture:
  name: soap_bpnn
  training:
    num_epochs: 5
    batch_size: 8
    loss:
      mtt::hirshfeld_charge:
        weight: 1.0

training_set:
  systems:
    read_from: qm7x.xyz
    length_unit: angstrom
  targets:
    mtt::hirshfeld_charge:
      key: hirshfeld_charge
      quantity: ""
      unit: e
      sample_kind: atom
      type: scalar

test_set: 0.1
validation_set: 0.1

# endpoint: multi  |  model: dpa3
# mtt train etc/qm7x_zenodo/options/multi-dpa3.yaml
# Data: qm7x.xyz (+ polarizability_spherical.mts when needed).
# Convert first: python etc/qm7x_zenodo/zenodo_to_metatensor.py --n-samples 200
# DPA3: energy + scalars only

seed: 42

architecture:
  name: experimental.dpa3
  training:
    num_epochs: 5
    batch_size: 8
    loss:
      energy:
        weight: 1.0
        gradients:
          positions:
            weight: 1.0
      mtt::hlgap:
        weight: 1.0
      mtt::hirshfeld_charge:
        weight: 1.0

training_set:
  systems:
    read_from: qm7x.xyz
    length_unit: angstrom
  targets:
    energy:
      key: energy
      unit: eV
      forces:
        key: forces
    mtt::hlgap:
      key: hlgap
      quantity: ""
      unit: eV
      sample_kind: system
      type: scalar
    mtt::hirshfeld_charge:
      key: hirshfeld_charge
      quantity: ""
      unit: e
      sample_kind: atom
      type: scalar

test_set: 0.1
validation_set: 0.1

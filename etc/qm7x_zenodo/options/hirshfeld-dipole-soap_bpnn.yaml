# endpoint: hirshfeld-dipole  |  model: soap_bpnn
# mtt train etc/qm7x_zenodo/options/hirshfeld-dipole-soap_bpnn.yaml
# Data: qm7x.xyz (+ polarizability_spherical.mts when needed).
# Convert first: python etc/qm7x_zenodo/zenodo_to_metatensor.py --n-samples 200
# atomic Hirshfeld dipoles, Cartesian rank-1

seed: 42

architecture:
  name: soap_bpnn
  training:
    num_epochs: 5
    batch_size: 8
    loss:
      mtt::hirshfeld_dipole:
        weight: 1.0

training_set:
  systems:
    read_from: qm7x.xyz
    length_unit: angstrom
  targets:
    mtt::hirshfeld_dipole:
      key: hirshfeld_dipole
      quantity: ""
      sample_kind: atom
      type:
        cartesian:
          rank: 1

test_set: 0.1
validation_set: 0.1

# SN2 (Zenodo 2605341): atomization energy, forces, molecular dipole.
# Matched-budget comparison recipe -- see ./README.md. ~99K parameters,
# same LR/schedule/epochs/batch size as the LOREM and PET recipes in this
# directory. Short-range only (default long_range.enable: false) -- the
# deliberate difference under test against LOREM's long-range block.
#
# NOTE (2026-09-07): max_radial bumped 3->4 (neurons 11->6 to compensate)
# vs. the energy/forces-only recipe. Investigation of the original (max_radial=3)
# dipole run showed the dipole loss plateaus almost immediately (training-set
# RMSE 0.404->0.382 e*A over 50 epochs, matching validation -- i.e. an
# optimization/capacity plateau, not overfitting) and does NOT respond to a
# 20x increase in the dipole loss weight (epoch-10 RMSE 0.389 either way).
# That rules out gradient competition with the energy/forces losses as the
# cause. Unlike LOREM/PET (which had genuine gradient-flow bugs in their old
# heads, now fixed), SOAP-BPNN's native rank-1 Cartesian head is architecturally
# sound (proper equivariant vector-basis x invariant-coefficient contraction,
# verified gradients flow correctly). The likely explanation is a genuine
# representational gap: SOAP-BPNN's learned vector-basis has no built-in
# geometric prior tying it to atomic positions, unlike LOREM/PET's
# charge-times-position head, which encodes mu = sum(q_i * r_i) directly and
# is far more data-efficient. This bump gives the vector-basis richer radial
# information as a fairer shot, not a bug fix -- see the artifact notes for
# the resulting numbers.
#
# Convert first:
#   bash etc/sn2_zenodo/convert.sh
# Then from ~/data/sn2 (or pass this file to train.sh):
#   mtt train /path/to/energy-forces-dipole-soap-bpnn.yaml

seed: 42

architecture:
  name: soap_bpnn
  model:
    soap:
      max_angular: 2
      max_radial: 4
      cutoff:
        radius: 5.0
        width: 0.5
    bpnn:
      num_hidden_layers: 1
      num_neurons_per_layer: 6
  training:
    num_epochs: 50
    batch_size: 16
    learning_rate: 0.0001
    warmup_fraction: 0.01
    best_model_metric: rmse_prod
    log_interval: 5
    scale_targets: true

training_set:
  systems:
    read_from: sn2.xyz
    length_unit: angstrom
  targets:
    energy:
      key: energy
      unit: eV
      forces:
        key: forces
    mtt::dipole:
      key: dipole_moment
      quantity: ""
      unit: e*A
      sample_kind: system
      type:
        cartesian:
          rank: 1

test_set: 0.1
validation_set: 0.1

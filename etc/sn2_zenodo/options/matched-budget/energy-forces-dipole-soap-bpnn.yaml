# SN2 (Zenodo 2605341): atomization energy, forces, molecular dipole.
# Matched-budget comparison recipe -- see ./README.md. ~95.6K parameters,
# same LR/schedule/epochs/batch size as the LOREM and PET recipes in this
# directory. Short-range only (default long_range.enable: false) -- the
# deliberate difference under test against LOREM's long-range block.
#
# NOTE (2026-09-08): SOAP-BPNN's native rank-1 Cartesian head (a learned,
# position-agnostic vector basis) was investigated after a weak dipole fit
# (r=0.31-0.32) and found to hit a genuine, capacity-independent plateau: the
# training-set dipole loss barely moves across 50 epochs while energy/forces
# converge normally, it does not respond to a 20x increase in the dipole
# loss weight, and a `max_radial` capacity bump (3->4) left it unchanged.
# Gradients were verified to flow correctly -- so this was not a bug, but a
# real representational gap: the native head has no built-in link between
# its predicted vector and the atom's actual position, unlike LOREM/PET's
# charge*position head (mu = sum(q_i * r_i)), a far more data-efficient
# physical prior for this task.
#
# Fix: `soap_bpnn/model.py` now special-cases rank-1 Cartesian targets to
# use the same charge*position construction (see the `charge_dipole_targets`
# branch in `_add_output`/`forward`), replacing the TensorBasis/vector-basis
# machinery for this target type only (scalar and rank-2 Cartesian targets
# are unaffected). This is a real architecture change, not a hyperparameter
# tweak -- see the SN2 Reaction Profiles artifact for the resulting numbers.
# max_radial reverted to 3 (matching the energy/forces-only recipe) since
# the new head needs far less capacity than the old vector-basis one did.
#
# Convert first:
#   bash etc/sn2_zenodo/convert.sh
# Then from ~/data/sn2 (or pass this file to train.sh):
#   mtt train /path/to/energy-forces-dipole-soap-bpnn.yaml

seed: 42

architecture:
  name: soap_bpnn
  model:
    soap:
      max_angular: 2
      max_radial: 3
      cutoff:
        radius: 5.0
        width: 0.5
    bpnn:
      num_hidden_layers: 1
      num_neurons_per_layer: 11
  training:
    num_epochs: 50
    batch_size: 16
    learning_rate: 0.0001
    warmup_fraction: 0.01
    best_model_metric: rmse_prod
    log_interval: 5
    scale_targets: true

training_set:
  systems:
    read_from: sn2.xyz
    length_unit: angstrom
  targets:
    energy:
      key: energy
      unit: eV
      forces:
        key: forces
    mtt::dipole:
      key: dipole_moment
      quantity: ""
      unit: e*A
      sample_kind: system
      type:
        cartesian:
          rank: 1

test_set: 0.1
validation_set: 0.1

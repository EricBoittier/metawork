# SN2 (Zenodo 2605341): atomization energy, forces.
# Matched-budget comparison recipe -- see ./README.md. ~93K parameters,
# same LR/schedule/epochs/batch size as the PET and SOAP-BPNN recipes in
# this directory. Long-range Ewald electrostatics is the one deliberate
# difference under test (PET/SOAP-BPNN here are short-range only).
#
# Convert first:
#   bash etc/sn2_zenodo/convert.sh
# Then from ~/data/sn2 (or pass this file to train.sh):
#   mtt train /path/to/energy-forces-lorem.yaml

seed: 42

architecture:
  name: experimental.lorem
  model:
    cutoff: 5.0
    cutoff_width: 0.5
    max_degree: 2
    max_degree_lr: 1
    num_features: 64
    num_spherical_features: 8
    num_radial: 16
    num_message_passing: 1
    long_range:
      enable: true
      use_ewald: true
      lr_scale_init: 1.0
  training:
    num_epochs: 50
    batch_size: 16
    learning_rate: 0.0001
    scheduler: cosine
    warmup_fraction: 0.01
    best_model_metric: rmse_prod
    log_interval: 5
    scale_targets: true
    loss:
      energy:
        weight: 1.0
        gradients:
          positions:
            weight: 1.0

training_set:
  systems:
    read_from: sn2.xyz
    length_unit: angstrom
  targets:
    energy:
      key: energy
      unit: eV
      forces:
        key: forces

test_set: 0.1
validation_set: 0.1

# SN2 (Zenodo 2605341): atomization energy, forces, molecular dipole.
# Matched-budget comparison recipe -- see ./README.md. ~103K parameters,
# same LR/schedule/epochs/batch size as the LOREM and SOAP-BPNN recipes in
# this directory. Short-range only (long_range.enable: false) -- the
# deliberate difference under test against LOREM's long-range block.
#
# Convert first:
#   bash etc/sn2_zenodo/convert.sh
# Then from ~/data/sn2 (or pass this file to train.sh):
#   mtt train /path/to/energy-forces-dipole-pet.yaml

seed: 42

architecture:
  name: pet
  model:
    cutoff: 5.0
    cutoff_width: 0.5
    d_pet: 48
    d_head: 32
    d_node: 80
    d_feedforward: 80
    num_heads: 2
    num_attention_layers: 1
    num_gnn_layers: 1
    long_range:
      enable: false
  training:
    num_epochs: 50
    batch_size: 16
    learning_rate: 0.0001
    warmup_fraction: 0.01
    best_model_metric: rmse_prod
    log_interval: 5
    scale_targets: true

training_set:
  systems:
    read_from: sn2.xyz
    length_unit: angstrom
  targets:
    energy:
      key: energy
      unit: eV
      forces:
        key: forces
    mtt::dipole:
      key: dipole_moment
      quantity: ""
      unit: e*A
      sample_kind: system
      type:
        cartesian:
          rank: 1

test_set: 0.1
validation_set: 0.1

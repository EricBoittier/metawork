# SN2 (Zenodo 2605341): atomization energy, forces, molecular dipole.
# Convert first:
#   bash etc/sn2_zenodo/convert.sh
# Then from ~/data/sn2 (or pass this file to train.sh):
#   RESTART=0 bash etc/sn2_zenodo/train.sh
# Architecture changes (max_degree, PET trunk, …) cannot restart from the
# older 92k-param model.ckpt; this checkout's mtt --restart keeps the
# checkpoint hypers. Move that file aside and train from scratch.

seed: 42

architecture:
  name: experimental.lorem
  model:
    cutoff: 5.0
    cutoff_width: 0.5
    max_degree: 6
    max_degree_lr: 2
    num_features: 64
    num_spherical_features: 16
    num_radial: 16
    num_message_passing: 2
    long_range:
      enable: true
      use_ewald: true
      lr_scale_init: 1.0
  training:
    # ``num_epochs`` is additional when restarting from model.ckpt.
    num_epochs: 50
    batch_size: 16
    learning_rate: 0.0001
    scheduler_factor: 0.8
    scheduler_patience: 20
    log_interval: 5
    scale_targets: true
    loss:
      energy:
        weight: 1.0
        gradients:
          positions:
            weight: 1.0
      mtt::dipole:
        weight: 1.0

training_set:
  systems:
    read_from: sn2.xyz
    length_unit: angstrom
  targets:
    energy:
      key: energy
      unit: eV
      forces:
        key: forces
    mtt::dipole:
      key: dipole_moment
      quantity: ""
      unit: e*A
      sample_kind: system
      type:
        cartesian:
          rank: 1

test_set: 0.1
validation_set: 0.1

# After `mtt train` (model.pt in the current directory):
#   mtt eval model.pt etc/sn2_zenodo/eval.yaml -o sn2-eval.xyz
# Run from the directory that contains sn2.xyz (usually ~/data/sn2).

systems:
  read_from: sn2.xyz
  length_unit: angstrom

targets:
  energy:
    key: energy
    unit: eV
  mtt::dipole:
    key: dipole_moment
    quantity: ""
    unit: e*A
    sample_kind: system
    type:
      cartesian:
        rank: 1
